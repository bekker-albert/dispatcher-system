name: Restore logistics runtime environment

on:
  push:
    branches:
      - feature/gazel-logistics-release
    paths:
      - ".github/workflows/logistics-env-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${DEPLOY_PORT}" -H "${DEPLOY_HOST}" >> ~/.ssh/known_hosts

      - name: Restore environment and restart only logistics
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -p "${DEPLOY_PORT}" "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<'EOF'
          set -euo pipefail
          export PATH="/usr/lib/ispnodejs/bin:/usr/local/bin:/usr/bin:/bin"
          export PM2_HOME="/var/www/dispatcher/data/.pm2"
          site="/var/www/dispatcher/data/www/logistics.aam-dispatch.kz"
          main_site="/var/www/dispatcher/data/www/aam-dispatch.kz"
          socket="/var/www/dispatcher/data/nodejs/0.sock"

          test -f "$main_site/.env.local"
          test -f "$site/logistics-server.js"
          cp "$main_site/.env.local" "$site/.env.local"
          chmod 600 "$site/.env.local"

          main_before=$(node -e "const{execFileSync}=require('node:child_process');const r=JSON.parse(execFileSync('/usr/lib/ispnodejs/bin/pm2',['jlist'],{encoding:'utf8',env:{...process.env,PM2_HOME:'/var/www/dispatcher/data/.pm2'}})).find(x=>x.name==='aam-dispatch');if(!r||r.pm2_env.status!=='online')process.exit(1);process.stdout.write(String(r.pm2_env.restart_time)+':'+String(r.pm2_env.pm_uptime))")

          /usr/lib/ispnodejs/bin/pm2 delete gazel-logistics-web >/dev/null 2>&1 || true
          rm -f "$socket"
          cd "$site"
          SOCKET_PATH="$socket" NODE_ENV=production /usr/lib/ispnodejs/bin/pm2 start logistics-server.js --name gazel-logistics-web --cwd "$site" --time --update-env
          /usr/lib/ispnodejs/bin/pm2 save

          healthy=0
          for attempt in $(seq 1 60); do
            if curl -fsS --unix-socket "$socket" http://localhost/health/ >/tmp/logistics-health.json 2>/dev/null; then healthy=1; break; fi
            sleep 2
          done
          test "$healthy" = "1"
          grep -q 'gazel-logistics-web' /tmp/logistics-health.json

          api_status=$(curl -sS -o /tmp/logistics-api-anon.json -w '%{http_code}' --unix-socket "$socket" -H 'Host: logistics.aam-dispatch.kz' http://localhost/api/logistics)
          echo "anonymous_api_status=$api_status"
          case "$api_status" in
            401|403) ;;
            *) cat /tmp/logistics-api-anon.json; exit 1;;
          esac

          node - <<'NODE'
          const { loadEnvConfig } = require('@next/env');
          const mysql = require('mysql2/promise');
          loadEnvConfig(process.cwd());
          const required = ['DB_HOST','DB_NAME','DB_USER','DB_PASSWORD','AUTH_SESSION_SECRET'];
          const missing = required.filter((key)=>!process.env[key]);
          if (missing.length) throw new Error(`Missing environment variables: ${missing.join(', ')}`);
          (async()=>{
            const connection = await mysql.createConnection({host:process.env.DB_HOST,port:Number(process.env.DB_PORT||3306),database:process.env.DB_NAME,user:process.env.DB_USER,password:process.env.DB_PASSWORD});
            await connection.query('SELECT 1');
            const tables=['logistics_requests','logistics_approvals','logistics_trips','logistics_trip_release_checklists','logistics_document_templates','logistics_document_instances','logistics_audit_events','logistics_config_versions'];
            const [rows]=await connection.query('SELECT table_name FROM information_schema.tables WHERE table_schema=?',[process.env.DB_NAME]);
            const existing=new Set(rows.map((row)=>row.TABLE_NAME||row.table_name));
            const missingTables=tables.filter((table)=>!existing.has(table));
            console.log(`missing_tables=${missingTables.join(',')}`);
            await connection.end();
            if(missingTables.length) throw new Error(`Missing tables: ${missingTables.join(', ')}`);
          })().catch((error)=>{console.error(error);process.exit(1)});
          NODE

          main_after=$(node -e "const{execFileSync}=require('node:child_process');const r=JSON.parse(execFileSync('/usr/lib/ispnodejs/bin/pm2',['jlist'],{encoding:'utf8',env:{...process.env,PM2_HOME:'/var/www/dispatcher/data/.pm2'}})).find(x=>x.name==='aam-dispatch');if(!r||r.pm2_env.status!=='online')process.exit(1);process.stdout.write(String(r.pm2_env.restart_time)+':'+String(r.pm2_env.pm_uptime))")
          test "$main_before" = "$main_after"
          EOF

      - name: Public smoke
        run: |
          set -euo pipefail
          curl -fsS --retry 20 --retry-delay 3 --max-time 20 https://logistics.aam-dispatch.kz/health/ | grep -q 'gazel-logistics-web'
          curl -fsS --retry 20 --retry-delay 3 --max-time 20 https://logistics.aam-dispatch.kz/ | grep -q 'Логистика Газели'
          curl -fsS --retry 20 --retry-delay 3 --max-time 20 https://aam-dispatch.kz/ >/tmp/aam-main.html
          test -s /tmp/aam-main.html
