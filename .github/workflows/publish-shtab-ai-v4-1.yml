name: Publish Shtab AI 4.1 APK
on:
  pull_request:
    branches:
      - main
permissions:
  contents: write
jobs:
  publish:
    if: startsWith(github.head_ref, 'temp/fix-shtab-ai-v4-1-download-')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore release signing key
        run: base64 -d shtab-ai-android/signing.keystore.b64 > shtab-ai-android/shtab-ai-release.jks
      - name: Build signed APK
        run: cd shtab-ai-android && gradle :app:assembleRelease --stacktrace
      - name: Verify APK
        shell: bash
        run: |
          set -o pipefail
          cp shtab-ai-android/app/build/outputs/apk/release/app-release.apk /tmp/Shtab-AI-v4.1.apk
          unzip -t /tmp/Shtab-AI-v4.1.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs /tmp/Shtab-AI-v4.1.apk
          sha256sum /tmp/Shtab-AI-v4.1.apk | tee /tmp/Shtab-AI-v4.1.sha256.txt
      - name: Publish public download branch
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan downloads-v4.1
          git rm -rf .
          cp /tmp/Shtab-AI-v4.1.apk ./Shtab-AI-v4.1.apk
          cp /tmp/Shtab-AI-v4.1.sha256.txt ./Shtab-AI-v4.1.sha256.txt
          APK_SHA=$(cut -d' ' -f1 /tmp/Shtab-AI-v4.1.sha256.txt)
          printf '%s\n' '# Shtab AI 4.1' 'Проверенный установочный APK.' "SHA-256: $APK_SHA" > README.md
          git add Shtab-AI-v4.1.apk Shtab-AI-v4.1.sha256.txt README.md
          git commit -m "Опубликовать Shtab AI 4.1 APK"
          git push --force origin HEAD:refs/heads/downloads-v4.1
