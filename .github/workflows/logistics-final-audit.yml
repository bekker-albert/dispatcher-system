name: Logistics final production audit

on:
  push:
    branches:
      - feature/gazel-logistics-release
    paths:
      - ".github/workflows/logistics-final-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${DEPLOY_PORT}" -H "${DEPLOY_HOST}" >> ~/.ssh/known_hosts

      - name: Audit server runtime and database
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -p "${DEPLOY_PORT}" "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<'EOF'
            set -euo pipefail
            export PATH="/usr/lib/ispnodejs/bin:/usr/local/bin:/usr/bin:/bin"
            export PM2_HOME="/var/www/dispatcher/data/.pm2"
            site="/var/www/dispatcher/data/www/logistics.aam-dispatch.kz"
            socket="/var/www/dispatcher/data/nodejs/0.sock"

            test -d "$site"
            test -S "$socket"
            test -f "$site/.next/BUILD_ID"
            test -f "$site/logistics-server.js"

            node <<'NODE'
            const { execFileSync } = require('node:child_process');
            const list = JSON.parse(execFileSync('/usr/lib/ispnodejs/bin/pm2', ['jlist'], { encoding: 'utf8', env: { ...process.env, PM2_HOME: '/var/www/dispatcher/data/.pm2' } }));
            for (const name of ['aam-dispatch', 'gazel-logistics-web']) {
              const processRow = list.find((row) => row.name === name);
              if (!processRow) throw new Error(`PM2 process missing: ${name}`);
              if (processRow.pm2_env?.status !== 'online') throw new Error(`PM2 process not online: ${name}`);
              console.log(`${name}: online; restarts=${processRow.pm2_env?.restart_time ?? 'unknown'}; uptime=${processRow.pm2_env?.pm_uptime ?? 'unknown'}`);
            }
            NODE

            curl -fsS --unix-socket "$socket" http://localhost/health/ | grep -q 'gazel-logistics-web'
            curl -fsS --unix-socket "$socket" -H 'Host: logistics.aam-dispatch.kz' http://localhost/ | grep -q 'Логистика Газели'
            curl -fsS --unix-socket "$socket" -H 'Host: logistics.aam-dispatch.kz' http://localhost/logistics/release | grep -q 'Выпуск'
            curl -fsS --unix-socket "$socket" -H 'Host: logistics.aam-dispatch.kz' http://localhost/logistics/documents | grep -q 'Документ'

            api_status=$(curl -sS -o /tmp/logistics-api-anon.json -w '%{http_code}' --unix-socket "$socket" -H 'Host: logistics.aam-dispatch.kz' http://localhost/api/logistics)
            case "$api_status" in
              401|403) ;;
              *) echo "Unexpected anonymous API status: $api_status"; cat /tmp/logistics-api-anon.json; exit 1;;
            esac

            if [ ! -f "$site/.env.local" ]; then
              echo "Missing logistics .env.local"
              exit 1
            fi

            cd "$site"
            node <<'NODE'
            const { loadEnvConfig } = require('@next/env');
            const mysql = require('mysql2/promise');
            loadEnvConfig(process.cwd());
            const required = ['DB_HOST', 'DB_NAME', 'DB_USER', 'DB_PASSWORD', 'AUTH_SESSION_SECRET'];
            const missing = required.filter((key) => !process.env[key]);
            if (missing.length) throw new Error(`Missing environment variables: ${missing.join(', ')}`);
            (async () => {
              const connection = await mysql.createConnection({
                host: process.env.DB_HOST,
                port: Number(process.env.DB_PORT || 3306),
                database: process.env.DB_NAME,
                user: process.env.DB_USER,
                password: process.env.DB_PASSWORD,
              });
              const tables = [
                'logistics_requests',
                'logistics_request_stops',
                'logistics_approvals',
                'logistics_approval_steps',
                'logistics_trips',
                'logistics_trip_requests',
                'logistics_trip_release_checklists',
                'logistics_document_templates',
                'logistics_document_package_rules',
                'logistics_document_instances',
                'logistics_audit_events',
                'logistics_config_versions',
              ];
              for (const table of tables) {
                const [rows] = await connection.query(
                  'SELECT COUNT(*) AS total FROM information_schema.tables WHERE table_schema = ? AND table_name = ?',
                  [process.env.DB_NAME, table],
                );
                if (Number(rows[0]?.total || 0) !== 1) throw new Error(`Missing database table: ${table}`);
              }
              const [auditRows] = await connection.query('SELECT COUNT(*) AS total FROM logistics_audit_events');
              console.log(`logistics audit events: ${Number(auditRows[0]?.total || 0)}`);
              await connection.end();
            })().catch((error) => { console.error(error); process.exit(1); });
            NODE
          EOF

      - name: Audit public endpoints
        run: |
          set -euo pipefail
          curl -fsS --retry 10 --retry-delay 3 --max-time 20 https://logistics.aam-dispatch.kz/health/ | grep -q 'gazel-logistics-web'
          curl -fsS --retry 10 --retry-delay 3 --max-time 20 https://logistics.aam-dispatch.kz/ | grep -q 'Логистика Газели'
          curl -fsS --retry 10 --retry-delay 3 --max-time 20 https://logistics.aam-dispatch.kz/logistics/release | grep -q 'Выпуск'
          curl -fsS --retry 10 --retry-delay 3 --max-time 20 https://logistics.aam-dispatch.kz/logistics/documents | grep -q 'Документ'
          curl -fsS --retry 10 --retry-delay 3 --max-time 20 https://aam-dispatch.kz/ > /tmp/aam-main.html
          test -s /tmp/aam-main.html

      - name: Audit completed
        run: echo "Logistics final audit completed"
