name: Diagnose dispetcher

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/diagnose-dispetcher.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${DEPLOY_PORT}" -H "${DEPLOY_HOST}" >> ~/.ssh/known_hosts

      - name: Inspect dispetcher binding
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -p "${DEPLOY_PORT}" "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s' <<'EOF'
            set -eu
            export PATH="/usr/lib/ispnodejs/bin:/usr/local/bin:/usr/bin:/bin"
            export PM2_HOME="/var/www/dispatcher/data/.pm2"
            DISP_DIR="/var/www/dispatcher/data/www/dispetcher.kz"
            LEGACY_DIR="/var/www/dispatcher/data/www/aam-dispatch.kz"

            echo "dispetcher_dir=$([ -d "$DISP_DIR" ] && echo yes || echo no)"
            echo "dispetcher_index=$([ -f "$DISP_DIR/index.html" ] && echo yes || echo no)"
            echo "dispetcher_git=$([ -d "$DISP_DIR/.git" ] && echo yes || echo no)"
            echo "dispetcher_env=$([ -f "$DISP_DIR/.env.local" ] && echo yes || echo no)"
            echo "legacy_dir=$([ -d "$LEGACY_DIR" ] && echo yes || echo no)"
            echo "legacy_git=$([ -d "$LEGACY_DIR/.git" ] && echo yes || echo no)"
            echo "legacy_env=$([ -f "$LEGACY_DIR/.env.local" ] && echo yes || echo no)"

            if command -v pm2 >/dev/null 2>&1; then
              pm2 jlist 2>/dev/null | node -e '
                let s=""; process.stdin.on("data",d=>s+=d).on("end",()=>{
                  try {
                    const rows=JSON.parse(s);
                    for (const p of rows) {
                      const env=p.pm2_env||{};
                      console.log(`pm2=${p.name};status=${env.status||""};cwd=${env.pm_cwd||""};port=${env.PORT||""}`);
                    }
                  } catch { console.log("pm2=parse-failed"); }
                });
              '
            else
              echo "pm2=not-found"
            fi

            CONF_FILES=$(grep -R -l -E 'server_name[^;]*dispetcher\.kz' /etc/nginx 2>/dev/null | head -n 5 || true)
            if [ -z "$CONF_FILES" ]; then
              echo "nginx_dispetcher_conf=not-found-or-not-readable"
            else
              printf '%s\n' "$CONF_FILES" | while IFS= read -r f; do
                [ -n "$f" ] || continue
                echo "nginx_conf=$(basename "$f");writable=$([ -w "$f" ] && echo yes || echo no)"
                grep -E '^[[:space:]]*(listen|server_name|root|proxy_pass)[[:space:]]' "$f" 2>/dev/null | sed -E 's/[[:space:]]+/ /g' | head -n 20 || true
              done
            fi

            if sudo -n true >/dev/null 2>&1; then
              echo "passwordless_sudo=yes"
            else
              echo "passwordless_sudo=no"
            fi
          EOF
