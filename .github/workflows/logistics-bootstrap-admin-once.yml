name: Provision logistics administrator once

on:
  push:
    branches:
      - feature/gazel-logistics-release
    paths:
      - ".github/workflows/logistics-bootstrap-admin-once.yml"

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${DEPLOY_PORT}" -H "${DEPLOY_HOST}" >> ~/.ssh/known_hosts

      - name: Create or reset administrator
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -p "${DEPLOY_PORT}" "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s' <<'EOF'
          set -euo pipefail
          export PATH="/usr/lib/ispnodejs/bin:/usr/local/bin:/usr/bin:/bin"
          site="/var/www/dispatcher/data/www/logistics.aam-dispatch.kz"
          cd "$site"
          test -f .env.local
          test -d node_modules

          node - <<'NODE'
          const { randomBytes } = require('node:crypto');
          const envModule = require('@next/env');
          const loadEnvConfig = envModule.loadEnvConfig || envModule.default?.loadEnvConfig;
          if (typeof loadEnvConfig !== 'function') throw new Error('Environment loader is unavailable');
          loadEnvConfig(process.cwd());
          const mysql = require('mysql2/promise');

          const login = 'administrator';
          const passwordHash = 'pbkdf2-sha256$210000$KC-YBh82Pa1TIFE2TEUvcA$Sms-VGljQyivqDoDAerH62TcCuzOarz6obMCVQNGx_8';

          (async () => {
            const connection = await mysql.createConnection({
              host: process.env.DB_HOST,
              port: Number(process.env.DB_PORT || 3306),
              database: process.env.DB_NAME,
              user: process.env.DB_USER,
              password: process.env.DB_PASSWORD,
              charset: 'utf8mb4',
            });

            try {
              const [rows] = await connection.execute(
                'SELECT user_id FROM auth_users WHERE login = ? LIMIT 1',
                [login],
              );

              if (rows.length) {
                await connection.execute(
                  `UPDATE auth_users
                   SET password_hash = ?, role = 'admin', can_manage_users = 1, active = 1,
                       display_name = 'Администратор логистики',
                       last_name = 'Администратор', first_name = 'Логистики',
                       position_title = 'Администратор системы'
                   WHERE user_id = ?`,
                  [passwordHash, rows[0].user_id],
                );
              } else {
                const userId = `usr_${randomBytes(12).toString('hex')}`;
                await connection.execute(
                  `INSERT INTO auth_users
                    (user_id, login, display_name, last_name, first_name, middle_name,
                     email, phone, position_title, role, can_manage_users, active,
                     tab_permissions, password_hash)
                   VALUES (?, ?, ?, ?, ?, '', '', '', ?, 'admin', 1, 1, NULL, ?)`,
                  [
                    userId,
                    login,
                    'Администратор логистики',
                    'Администратор',
                    'Логистики',
                    'Администратор системы',
                    passwordHash,
                  ],
                );
              }

              const [verified] = await connection.execute(
                `SELECT login, role, can_manage_users, active
                 FROM auth_users WHERE login = ? LIMIT 1`,
                [login],
              );
              const user = verified[0];
              if (!user || user.role !== 'admin' || Number(user.can_manage_users) !== 1 || Number(user.active) !== 1) {
                throw new Error('Administrator verification failed');
              }
              console.log('administrator_ready=true');
            } finally {
              await connection.end();
            }
          })().catch((error) => {
            console.error(error.message);
            process.exit(1);
          });
          NODE
          EOF
