name: Logistics admin build diagnostics

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/logistics-admin-build-diagnostics.yml"
      - "app/api/logistics/**"
      - "app/logistics/**"
      - "features/logistics/**"
      - "lib/domain/logistics/**"
      - "lib/server/logistics/**"
      - "lib/server/mysql/logistics-*.ts"
      - "lib/server/mysql/schema.ts"
      - "logistics-server.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --silent

      - name: Type check
        run: npm run typecheck

      - name: Build web application
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${DEPLOY_PORT}" -H "${DEPLOY_HOST}" >> ~/.ssh/known_hosts

      - name: Capture production audit
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        shell: bash
        run: |
          set +e
          ssh -i ~/.ssh/id_ed25519 -p "${DEPLOY_PORT}" "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s > logistics-production-audit.log 2>&1 <<'EOF'
            set -u
            export PATH="/usr/lib/ispnodejs/bin:/usr/local/bin:/usr/bin:/bin"
            export PM2_HOME="/var/www/dispatcher/data/.pm2"
            site="/var/www/dispatcher/data/www/logistics.aam-dispatch.kz"
            main_site="/var/www/dispatcher/data/www/aam-dispatch.kz"
            socket="/var/www/dispatcher/data/nodejs/0.sock"
            failures=0

            check() {
              label="$1"; shift
              if "$@"; then echo "PASS: $label"; else echo "FAIL: $label"; failures=$((failures+1)); fi
            }

            check "logistics site directory" test -d "$site"
            check "logistics socket" test -S "$socket"
            check "logistics build" test -f "$site/.next/BUILD_ID"
            check "logistics server entry" test -f "$site/logistics-server.js"
            check "logistics env file" test -f "$site/.env.local"
            check "main env file" test -f "$main_site/.env.local"

            node <<'NODE' || failures=$((failures+1))
            const { execFileSync } = require('node:child_process');
            const rows = JSON.parse(execFileSync('/usr/lib/ispnodejs/bin/pm2', ['jlist'], {encoding:'utf8', env:{...process.env, PM2_HOME:'/var/www/dispatcher/data/.pm2'}}));
            for (const name of ['aam-dispatch','gazel-logistics-web']) {
              const row = rows.find((item)=>item.name===name);
              console.log(`${row && row.pm2_env?.status === 'online' ? 'PASS' : 'FAIL'}: PM2 ${name}; status=${row?.pm2_env?.status ?? 'missing'}; restarts=${row?.pm2_env?.restart_time ?? 'unknown'}; uptime=${row?.pm2_env?.pm_uptime ?? 'unknown'}`);
              if (!row || row.pm2_env?.status !== 'online') process.exitCode = 1;
            }
            NODE

            for path in /health/ / /logistics/release /logistics/documents; do
              code=$(curl -sS -o /tmp/body.out -w '%{http_code}' --unix-socket "$socket" -H 'Host: logistics.aam-dispatch.kz' "http://localhost$path" 2>/tmp/curl.err || true)
              echo "INFO: internal $path status=$code bytes=$(wc -c </tmp/body.out 2>/dev/null || echo 0)"
              case "$path:$code" in
                /health/:200|/:200|/logistics/release:200|/logistics/documents:200) ;;
                *) echo "FAIL: internal endpoint $path"; cat /tmp/curl.err; failures=$((failures+1));;
              esac
            done

            api_status=$(curl -sS -o /tmp/api.out -w '%{http_code}' --unix-socket "$socket" -H 'Host: logistics.aam-dispatch.kz' http://localhost/api/logistics 2>/tmp/api.err || true)
            echo "INFO: anonymous API status=$api_status body=$(cat /tmp/api.out 2>/dev/null || true)"
            case "$api_status" in 401|403) echo "PASS: anonymous API blocked";; *) echo "FAIL: anonymous API must be blocked"; failures=$((failures+1));; esac

            if [ -f "$site/.env.local" ]; then
              cd "$site"
              node <<'NODE' || failures=$((failures+1))
              const { loadEnvConfig } = require('@next/env');
              const mysql = require('mysql2/promise');
              loadEnvConfig(process.cwd());
              const keys = ['DB_HOST','DB_NAME','DB_USER','DB_PASSWORD','AUTH_SESSION_SECRET','AUTH_REQUIRED'];
              for (const key of keys) console.log(`${process.env[key] ? 'PASS' : 'FAIL'}: env ${key}`);
              const missing = ['DB_HOST','DB_NAME','DB_USER','DB_PASSWORD','AUTH_SESSION_SECRET'].filter((key)=>!process.env[key]);
              if (missing.length) throw new Error(`Missing environment variables: ${missing.join(', ')}`);
              (async()=>{
                const connection = await mysql.createConnection({host:process.env.DB_HOST,port:Number(process.env.DB_PORT||3306),database:process.env.DB_NAME,user:process.env.DB_USER,password:process.env.DB_PASSWORD});
                console.log('PASS: database connection');
                const required = ['logistics_requests','logistics_request_stops','logistics_approvals','logistics_approval_steps','logistics_trips','logistics_trip_requests','logistics_trip_release_checklists','logistics_document_templates','logistics_document_package_rules','logistics_document_instances','logistics_audit_events','logistics_config_versions'];
                const [rows] = await connection.query('SELECT table_name FROM information_schema.tables WHERE table_schema = ?', [process.env.DB_NAME]);
                const existing = new Set(rows.map((row)=>row.TABLE_NAME || row.table_name));
                for (const table of required) console.log(`${existing.has(table) ? 'PASS' : 'FAIL'}: table ${table}`);
                const missingTables = required.filter((table)=>!existing.has(table));
                const [auditRows] = await connection.query('SELECT COUNT(*) AS total FROM logistics_audit_events').catch(()=>[[{total:'unavailable'}]]);
                console.log(`INFO: audit events=${auditRows[0]?.total ?? 'unknown'}`);
                await connection.end();
                if (missingTables.length) throw new Error(`Missing tables: ${missingTables.join(', ')}`);
              })().catch((error)=>{console.error(`FAIL: ${error.message}`);process.exit(1)});
              NODE
            fi

            echo "INFO: failures=$failures"
            exit "$failures"
          EOF
          code=$?
          echo "$code" > logistics-production-audit.exit
          cat logistics-production-audit.log
          exit 0

      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: logistics-production-audit
          path: |
            logistics-production-audit.log
            logistics-production-audit.exit

      - name: Fail when production audit failed
        run: test "$(cat logistics-production-audit.exit)" = "0"

      - name: Audit public endpoints and main-site availability
        run: |
          set -euo pipefail
          curl -fsS --retry 10 --retry-delay 3 --max-time 20 https://logistics.aam-dispatch.kz/health/ | grep -q 'gazel-logistics-web'
          curl -fsS --retry 10 --retry-delay 3 --max-time 20 https://logistics.aam-dispatch.kz/ | grep -q 'Логистика Газели'
          curl -fsS --retry 10 --retry-delay 3 --max-time 20 https://logistics.aam-dispatch.kz/logistics/release | grep -q 'Выпуск'
          curl -fsS --retry 10 --retry-delay 3 --max-time 20 https://logistics.aam-dispatch.kz/logistics/documents | grep -q 'Документ'
          curl -fsS --retry 10 --retry-delay 3 --max-time 20 https://aam-dispatch.kz/ > /tmp/aam-main.html
          test -s /tmp/aam-main.html
