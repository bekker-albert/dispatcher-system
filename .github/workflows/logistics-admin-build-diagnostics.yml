name: Logistics admin build diagnostics

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/logistics-admin-build-diagnostics.yml"
      - "app/api/logistics/**"
      - "app/logistics/**"
      - "features/logistics/**"
      - "lib/domain/logistics/**"
      - "lib/server/logistics/**"
      - "lib/server/mysql/logistics-*.ts"
      - "lib/server/mysql/schema.ts"
      - "logistics-server.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --silent

      - name: Type check
        run: npm run typecheck

      - name: Build web application
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${DEPLOY_PORT}" -H "${DEPLOY_HOST}" >> ~/.ssh/known_hosts

      - name: Restore environment and initialize logistics schema
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -p "${DEPLOY_PORT}" "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s' <<'EOF'
          set -euo pipefail
          export PATH="/usr/lib/ispnodejs/bin:/usr/local/bin:/usr/bin:/bin"
          export PM2_HOME="/var/www/dispatcher/data/.pm2"
          site="/var/www/dispatcher/data/www/logistics.aam-dispatch.kz"
          main_site="/var/www/dispatcher/data/www/aam-dispatch.kz"
          socket="/var/www/dispatcher/data/nodejs/0.sock"
          test -f "$main_site/.env.local"
          test -f "$site/logistics-server.js"
          main_before=$(node -e "const{execFileSync}=require('node:child_process');const r=JSON.parse(execFileSync('/usr/lib/ispnodejs/bin/pm2',['jlist'],{encoding:'utf8',env:{...process.env,PM2_HOME:'/var/www/dispatcher/data/.pm2'}})).find(x=>x.name==='aam-dispatch');if(!r||r.pm2_env.status!=='online')process.exit(1);process.stdout.write(String(r.pm2_env.restart_time)+':'+String(r.pm2_env.pm_uptime))")

          cp "$main_site/.env.local" "$site/.env.local"
          chmod 600 "$site/.env.local"
          /usr/lib/ispnodejs/bin/pm2 delete gazel-logistics-web >/dev/null 2>&1 || true
          rm -f "$socket"
          cd "$site"
          SOCKET_PATH="$socket" NODE_ENV=production /usr/lib/ispnodejs/bin/pm2 start logistics-server.js --name gazel-logistics-web --cwd "$site" --time --update-env
          /usr/lib/ispnodejs/bin/pm2 save

          healthy=0
          for attempt in $(seq 1 60); do
            if curl -fsS --unix-socket "$socket" http://localhost/health/ >/tmp/logistics-health.json 2>/dev/null; then healthy=1; break; fi
            sleep 2
          done
          test "$healthy" = "1"
          grep -q 'gazel-logistics-web' /tmp/logistics-health.json

          node -e "const{loadEnvConfig}=require('@next/env');const fs=require('node:fs');loadEnvConfig(process.cwd());const login=process.env.AUTH_INITIAL_LOGIN;const password=process.env.AUTH_INITIAL_PASSWORD;if(!login||!password)throw new Error('AUTH_INITIAL_LOGIN and AUTH_INITIAL_PASSWORD are required for schema bootstrap');fs.writeFileSync('/tmp/logistics-login.json',JSON.stringify({login,password}),{mode:0o600})"
          login_status=$(curl -sS -o /tmp/logistics-login-response.json -w '%{http_code}' --unix-socket "$socket" -H 'Host: logistics.aam-dispatch.kz' -H 'Content-Type: application/json' -c /tmp/logistics-cookie.txt --data-binary @/tmp/logistics-login.json http://localhost/api/auth/login)
          echo "schema bootstrap login status: $login_status"
          test "$login_status" = "200"
          api_status=$(curl -sS -o /tmp/logistics-bootstrap.json -w '%{http_code}' --unix-socket "$socket" -H 'Host: logistics.aam-dispatch.kz' -b /tmp/logistics-cookie.txt http://localhost/api/logistics)
          echo "authenticated logistics API status: $api_status"
          test "$api_status" = "200"
          rm -f /tmp/logistics-login.json /tmp/logistics-login-response.json /tmp/logistics-cookie.txt /tmp/logistics-bootstrap.json

          main_after=$(node -e "const{execFileSync}=require('node:child_process');const r=JSON.parse(execFileSync('/usr/lib/ispnodejs/bin/pm2',['jlist'],{encoding:'utf8',env:{...process.env,PM2_HOME:'/var/www/dispatcher/data/.pm2'}})).find(x=>x.name==='aam-dispatch');if(!r||r.pm2_env.status!=='online')process.exit(1);process.stdout.write(String(r.pm2_env.restart_time)+':'+String(r.pm2_env.pm_uptime))")
          test "$main_before" = "$main_after"
          EOF

      - name: Audit production runtime and authorization
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -p "${DEPLOY_PORT}" "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s' <<'EOF'
          set -euo pipefail
          export PATH="/usr/lib/ispnodejs/bin:/usr/local/bin:/usr/bin:/bin"
          export PM2_HOME="/var/www/dispatcher/data/.pm2"
          site="/var/www/dispatcher/data/www/logistics.aam-dispatch.kz"
          socket="/var/www/dispatcher/data/nodejs/0.sock"
          test -d "$site"
          test -S "$socket"
          test -f "$site/.next/BUILD_ID"
          test -f "$site/logistics-server.js"
          test -f "$site/.env.local"
          node -e "const{execFileSync}=require('node:child_process');const rows=JSON.parse(execFileSync('/usr/lib/ispnodejs/bin/pm2',['jlist'],{encoding:'utf8',env:{...process.env,PM2_HOME:'/var/www/dispatcher/data/.pm2'}}));for(const name of ['aam-dispatch','gazel-logistics-web']){const r=rows.find(x=>x.name===name);if(!r||r.pm2_env.status!=='online')throw new Error('PM2 process unavailable: '+name);console.log(name+': online')}"
          curl -fsS --unix-socket "$socket" http://localhost/health/ | grep -q 'gazel-logistics-web'
          curl -fsS --unix-socket "$socket" -H 'Host: logistics.aam-dispatch.kz' http://localhost/ | grep -q 'Логистика Газели'
          curl -fsS --unix-socket "$socket" -H 'Host: logistics.aam-dispatch.kz' http://localhost/logistics/release | grep -q 'Выпуск'
          curl -fsS --unix-socket "$socket" -H 'Host: logistics.aam-dispatch.kz' http://localhost/logistics/documents | grep -q 'Документ'
          api_status=$(curl -sS -o /tmp/logistics-api-anon.json -w '%{http_code}' --unix-socket "$socket" -H 'Host: logistics.aam-dispatch.kz' http://localhost/api/logistics)
          echo "anonymous API status: $api_status"
          case "$api_status" in 401|403) ;; *) cat /tmp/logistics-api-anon.json; exit 1;; esac
          EOF

      - name: Audit production database and schemas
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -p "${DEPLOY_PORT}" "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s' <<'EOF'
          set -euo pipefail
          export PATH="/usr/lib/ispnodejs/bin:/usr/local/bin:/usr/bin:/bin"
          site="/var/www/dispatcher/data/www/logistics.aam-dispatch.kz"
          cd "$site"
          node -e "const{loadEnvConfig}=require('@next/env');const mysql=require('mysql2/promise');loadEnvConfig(process.cwd());const required=['DB_HOST','DB_NAME','DB_USER','DB_PASSWORD','AUTH_SESSION_SECRET'];const missing=required.filter(k=>!process.env[k]);if(missing.length)throw new Error('Missing environment variables: '+missing.join(', '));(async()=>{const c=await mysql.createConnection({host:process.env.DB_HOST,port:Number(process.env.DB_PORT||3306),database:process.env.DB_NAME,user:process.env.DB_USER,password:process.env.DB_PASSWORD});const tables=['logistics_requests','logistics_request_stops','logistics_approvals','logistics_approval_steps','logistics_trips','logistics_trip_requests','logistics_trip_release_checklists','logistics_document_templates','logistics_document_package_rules','logistics_document_instances','logistics_audit_events','logistics_config_versions'];const [rows]=await c.query('SELECT table_name FROM information_schema.tables WHERE table_schema=?',[process.env.DB_NAME]);const existing=new Set(rows.map(r=>r.TABLE_NAME||r.table_name));const absent=tables.filter(t=>!existing.has(t));const[audit]=await c.query('SELECT COUNT(*) AS total FROM logistics_audit_events');console.log('audit events='+audit[0].total);await c.end();if(absent.length)throw new Error('Missing tables: '+absent.join(', '))})().catch(e=>{console.error(e);process.exit(1)})"
          EOF

      - name: Audit public endpoints and main-site availability
        run: |
          set -euo pipefail
          curl -fsS --retry 10 --retry-delay 3 --max-time 20 https://logistics.aam-dispatch.kz/health/ | grep -q 'gazel-logistics-web'
          curl -fsS --retry 10 --retry-delay 3 --max-time 20 https://logistics.aam-dispatch.kz/ | grep -q 'Логистика Газели'
          curl -fsS --retry 10 --retry-delay 3 --max-time 20 https://logistics.aam-dispatch.kz/logistics/release | grep -q 'Выпуск'
          curl -fsS --retry 10 --retry-delay 3 --max-time 20 https://logistics.aam-dispatch.kz/logistics/documents | grep -q 'Документ'
          curl -fsS --retry 10 --retry-delay 3 --max-time 20 https://aam-dispatch.kz/ > /tmp/aam-main.html
          test -s /tmp/aam-main.html
