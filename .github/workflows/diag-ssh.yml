name: Diagnose SSH

on:
  push:
    branches:
      - diag/dispetcher

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Test dispetcher SSH
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set +e
          echo "DNS:"
          getent ahosts dispetcher.kz | head -n 5 || true
          timeout 10 bash -lc '</dev/tcp/dispetcher.kz/22' && echo "tcp22=ok" || echo "tcp22=failed"
          ssh -vv -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 -i ~/.ssh/id_ed25519 -p 22 "$DEPLOY_USER@dispetcher.kz" 'echo ssh=ok; whoami; pwd; test -d /var/www/dispatcher/data/www/dispetcher.kz && echo dispetcher_dir=yes || echo dispetcher_dir=no; test -d /var/www/dispatcher/data/www/aam-dispatch.kz && echo legacy_dir=yes || echo legacy_dir=no' 2>&1 | sed -E 's/(Offering public key: ).*/\1[masked]/; s/(identity file ).*/\1[masked]/' | tail -n 80
          exit ${PIPESTATUS[0]}
