name: Diagnose production database

on:
  push:
    branches:
      - diag/dispetcher

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H dispetcher.kz >> ~/.ssh/known_hosts

      - name: Inspect database setup without secrets
        run: |
          ssh -i ~/.ssh/id_ed25519 root@dispetcher.kz 'bash -s' <<'EOF'
            set -u
            APP_DIR="/var/www/www-root/data/apps/dispatcher-system"
            ENV_FILE="$APP_DIR/.env.local"

            echo "=== ENV FILE ==="
            echo "exists=$([ -f "$ENV_FILE" ] && echo yes || echo no)"
            if [ -f "$ENV_FILE" ]; then
              grep -E '^[A-Za-z_][A-Za-z0-9_]*=' "$ENV_FILE" | cut -d= -f1 | sort | sed 's/$/=SET/'
            fi

            echo "=== REQUIRED DB KEYS ==="
            for key in DB_NAME DB_USER DB_PASSWORD DB_HOST DB_PORT; do
              if [ -f "$ENV_FILE" ] && grep -qE "^${key}=" "$ENV_FILE"; then
                value=$(grep -E "^${key}=" "$ENV_FILE" | tail -n1 | cut -d= -f2-)
                echo "$key=$([ -n "$value" ] && echo SET || echo EMPTY)"
              else
                echo "$key=MISSING"
              fi
            done

            echo "=== MYSQL SERVICE ==="
            command -v mariadb || true
            command -v mysql || true
            systemctl is-active mariadb 2>/dev/null || true
            systemctl is-active mysql 2>/dev/null || true

            echo "=== DATABASES VIA LOCAL ROOT SOCKET ==="
            if command -v mariadb >/dev/null 2>&1; then
              mariadb -NBe 'SHOW DATABASES' 2>&1 | head -n 30 || true
            elif command -v mysql >/dev/null 2>&1; then
              mysql -NBe 'SHOW DATABASES' 2>&1 | head -n 30 || true
            fi

            echo "=== LOCAL API STATUS ==="
            curl -sS -i http://127.0.0.1:3000/api/database | head -n 20 || true
          EOF
