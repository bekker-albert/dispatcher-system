name: Diagnose production database

on:
  push:
    branches:
      - diag/dispetcher

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H dispetcher.kz >> ~/.ssh/known_hosts

      - name: Verify database connection without exposing secrets
        run: |
          ssh -i ~/.ssh/id_ed25519 root@dispetcher.kz 'bash -s' <<'EOF'
            set -u
            export PATH="/usr/lib/ispnodejs/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
            APP_DIR="/var/www/www-root/data/apps/dispatcher-system"
            cd "$APP_DIR"

            echo "=== ERROR TEXT SOURCE ==="
            grep -R -n --exclude-dir=.next --exclude-dir=node_modules 'База данных не настроена' app features lib 2>/dev/null | head -n 20 || true

            echo "=== APP DB CONNECTION ==="
            node <<'NODE'
            const fs = require('fs');
            const mysql = require('mysql2/promise');
            const raw = fs.readFileSync('.env.local', 'utf8');
            const env = {};
            for (const line of raw.split(/\r?\n/)) {
              const match = line.match(/^([A-Za-z_][A-Za-z0-9_]*)=(.*)$/);
              if (!match) continue;
              let value = match[2].trim();
              if ((value.startsWith('"') && value.endsWith('"')) || (value.startsWith("'") && value.endsWith("'"))) {
                value = value.slice(1, -1);
              }
              env[match[1]] = value;
            }
            (async () => {
              const connection = await mysql.createConnection({
                host: env.DB_HOST || 'localhost',
                port: Number(env.DB_PORT || 3306),
                user: env.DB_USER,
                password: env.DB_PASSWORD,
                database: env.DB_NAME,
              });
              const [rows] = await connection.query('SELECT 1 AS ok');
              const [tables] = await connection.query('SHOW TABLES');
              console.log(`connection=${rows?.[0]?.ok === 1 ? 'ok' : 'unexpected'}`);
              console.log(`table_count=${tables.length}`);
              await connection.end();
            })().catch((error) => {
              console.log(`connection=failed`);
              console.log(`code=${error && error.code ? error.code : 'unknown'}`);
              process.exitCode = 1;
            });
            NODE

            echo "=== LOCAL API STATUS ==="
            curl -sS http://127.0.0.1:3000/api/database || true
            echo
          EOF
