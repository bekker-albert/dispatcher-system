name: Temporary build Shtab AI APK

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-apk:
    if: ${{ startsWith(github.head_ref, 'temp/build-shtab-ai-apk-') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout temporary build branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Skip when output already exists
        id: existing
        shell: bash
        run: |
          if [ -f build-output/build-complete.txt ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java
        if: steps.existing.outputs.skip != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        if: steps.existing.outputs.skip != 'true'
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        if: steps.existing.outputs.skip != 'true'
        shell: bash
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        if: steps.existing.outputs.skip != 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Android project
        if: steps.existing.outputs.skip != 'true'
        shell: bash
        run: |
          mkdir -p "$(dirname 'settings.gradle.kts')"
          echo '' | base64 -d > 'settings.gradle.kts'
          mkdir -p "$(dirname 'build.gradle.kts')"
          echo 'cGx1Z2lucyB7IGlkKCJjb20uYW5kcm9pZC5hcHBsaWNhdGlvbiIpIHZlcnNpb24gIjguNy4zIiBhcHBseSBmYWxzZSB9Cg==' | base64 -d > 'build.gradle.kts'
          mkdir -p "$(dirname 'app/build.gradle.kts')"
          echo '' | base64 -d > 'app/build.gradle.kts'
          mkdir -p "$(dirname 'app/src/main/AndroidManifest.xml')"
          echo '' | base64 -d > 'app/src/main/AndroidManifest.xml'
          mkdir -p "$(dirname 'app/src/main/java/kz/shtabai/app/MainActivity.java')"
          echo '' | base64 -d > 'app/src/main/java/kz/shtabai/app/MainActivity.java'
          mkdir -p "$(dirname 'app/src/main/java/kz/shtabai/app/ReminderReceiver.java')"
          echo '' | base64 -d > 'app/src/main/java/kz/shtabai/app/ReminderReceiver.java'
          mkdir -p "$(dirname 'app/src/main/res/values/styles.xml')"
          echo '' | base64 -d > 'app/src/main/res/values/styles.xml'
          mkdir -p "$(dirname 'app/src/main/res/drawable/app_icon.xml')"
          echo 'PD94bWwgdmVyc2lvbj0iMS4wIiBlbmNvZGluZz0idXRmLTgiPz4KPHZlY3RvciB4bWxuczp...TRUNCATED_FOR_TOOL...' | base64 -d > 'app/src/main/assets/app.js'

      - name: Build installable APK
        if: steps.existing.outputs.skip != 'true'
        shell: bash
        run: gradle :app:assembleDebug --stacktrace

      - name: Save APK as text chunks
        if: steps.existing.outputs.skip != 'true'
        shell: bash
        run: |
          mkdir -p build-output
          cp app/build/outputs/apk/debug/app-debug.apk build-output/Shtab-AI-v1.apk
          sha256sum build-output/Shtab-AI-v1.apk > build-output/sha256.txt
          base64 -w0 build-output/Shtab-AI-v1.apk | split -b 700000 -d -a 3 - build-output/apk.b64.part-
          ls -1 build-output/apk.b64.part-* > build-output/parts.txt
          printf "Штаб AI 1.0.0\nAPK собран GitHub Actions\n" > build-output/build-complete.txt
          rm build-output/Shtab-AI-v1.apk

      - name: Commit temporary build output
        if: steps.existing.outputs.skip != 'true'
        shell: bash
        run: |
          git config user.name "shtab-ai-builder"
          git config user.email "actions@users.noreply.github.com"
          git add build-output
          git commit -m "chore: temporary APK build output [skip ci]"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
