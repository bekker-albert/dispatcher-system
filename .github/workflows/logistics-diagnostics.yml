name: Logistics diagnostics

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/logistics-diagnostics.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${DEPLOY_PORT}" -H "${DEPLOY_HOST}" >> ~/.ssh/known_hosts

      - name: Read assigned logistics port
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: ssh -i ~/.ssh/id_ed25519 -p "${DEPLOY_PORT}" "${DEPLOY_USER}@${DEPLOY_HOST}" 'port=$(grep -RhoE "127\.0\.0\.1:[0-9]+" /etc/nginx/vhosts-resources/logistics.aam-dispatch.kz/dynamic 2>/dev/null | head -1 | cut -d: -f2); echo "LOGISTICS_PORT=${port:-NOT_FOUND}"; echo "DYNAMIC_CONFIG:"; grep -RInE "proxy_pass|127\.0\.0\.1:[0-9]+" /etc/nginx/vhosts-resources/logistics.aam-dispatch.kz/dynamic 2>/dev/null || true'
