name: Correct logistics administrator password once

on:
  push:
    branches:
      - feature/gazel-logistics-release
    paths:
      - ".github/workflows/logistics-correct-admin-password-once.yml"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/logistics-correct-admin-password-once.yml"

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${DEPLOY_PORT}" -H "${DEPLOY_HOST}" >> ~/.ssh/known_hosts

      - name: Correct administrator password hash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -p "${DEPLOY_PORT}" "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s' <<'EOF'
          set -euo pipefail
          export PATH="/usr/lib/ispnodejs/bin:/usr/local/bin:/usr/bin:/bin"
          site="/var/www/dispatcher/data/www/logistics.aam-dispatch.kz"
          cd "$site"
          test -f .env.local
          test -d node_modules

          node - <<'NODE'
          const envModule = require('@next/env');
          const loadEnvConfig = envModule.loadEnvConfig || envModule.default?.loadEnvConfig;
          if (typeof loadEnvConfig !== 'function') throw new Error('Environment loader is unavailable');
          loadEnvConfig(process.cwd());
          const mysql = require('mysql2/promise');

          const login = 'administrator';
          const passwordHash = 'pbkdf2-sha256$210000$6HGlZ4KZrZzXC70k5CyIAQ$o9GoG0hn6SvNz_abFbRMKrKSxnLxGQ_Oiy8RNIeUg98';

          (async () => {
            const connection = await mysql.createConnection({
              host: process.env.DB_HOST,
              port: Number(process.env.DB_PORT || 3306),
              database: process.env.DB_NAME,
              user: process.env.DB_USER,
              password: process.env.DB_PASSWORD,
              charset: 'utf8mb4',
            });
            try {
              const [result] = await connection.execute(
                `UPDATE auth_users
                 SET password_hash = ?, role = 'admin', can_manage_users = 1, active = 1
                 WHERE login = ?`,
                [passwordHash, login],
              );
              if (Number(result.affectedRows) !== 1) throw new Error('Administrator account was not updated');

              const [rows] = await connection.execute(
                `SELECT login, role, can_manage_users, active, password_hash
                 FROM auth_users WHERE login = ? LIMIT 1`,
                [login],
              );
              const user = rows[0];
              if (!user || user.password_hash !== passwordHash || user.role !== 'admin'
                || Number(user.can_manage_users) !== 1 || Number(user.active) !== 1) {
                throw new Error('Administrator verification failed');
              }
              console.log('administrator_password_corrected=true');
            } finally {
              await connection.end();
            }
          })().catch((error) => {
            console.error(error.message);
            process.exit(1);
          });
          NODE
          EOF
