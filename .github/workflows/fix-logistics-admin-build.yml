name: Fix logistics admin build

on:
  push:
    branches: [feature/gazel-logistics-release]
    paths:
      - ".github/workflows/fix-logistics-admin-build.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/gazel-logistics-release
      - name: Fix browser document reference
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('features/logistics/AdvancedAdminWorkspace.tsx')
          text = path.read_text(encoding='utf-8')
          old = 'document.querySelectorAll<HTMLInputElement>'
          new = 'window.document.querySelectorAll<HTMLInputElement>'
          if old not in text:
              raise SystemExit('Target expression not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add features/logistics/AdvancedAdminWorkspace.tsx
          git commit -m "fix: use browser document in permissions selector"
          git push origin HEAD:feature/gazel-logistics-release
