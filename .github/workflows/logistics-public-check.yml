name: Logistics public check

on:
  pull_request:
    branches: [main]
    paths: [".github/workflows/logistics-public-check.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${DEPLOY_PORT}" -H "${DEPLOY_HOST}" >> ~/.ssh/known_hosts

      - name: Inspect process termination
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -p "${DEPLOY_PORT}" "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s' <<'EOF'
            export PATH="/usr/lib/ispnodejs/bin:/usr/local/bin:/usr/bin:/bin"
            export PM2_HOME="/var/www/dispatcher/data/.pm2"
            echo "PM2_LIST:"
            /usr/lib/ispnodejs/bin/pm2 list || true
            echo "DUMP_MATCH:"
            grep -n -A8 -B4 'gazel-logistics' "$PM2_HOME/dump.pm2" 2>/dev/null || true
            echo "OUT_LOG:"
            tail -30 "$PM2_HOME/logs/gazel-logistics-out.log" 2>/dev/null || true
            echo "ERROR_LOG:"
            tail -50 "$PM2_HOME/logs/gazel-logistics-error.log" 2>/dev/null || true
            echo "PM2_DAEMON_LOG:"
            tail -60 "$PM2_HOME/pm2.log" 2>/dev/null || true
            echo "FILES:"
            ls -la /var/www/dispatcher/data/www/logistics.aam-dispatch.kz/server.js /var/www/dispatcher/data/nodejs 2>/dev/null || true
          EOF
