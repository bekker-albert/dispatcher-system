name: Logistics payload check

on:
  pull_request:
    branches: [main]
    paths: [".github/workflows/logistics-payload-check.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Download raw blob
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github.raw+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/2e193b08e20732f3e224150da72677e1b133a8a4" \
            -o /tmp/payload.tar.xz
          wc -c /tmp/payload.tar.xz
          sha256sum /tmp/payload.tar.xz
          echo "647653312cc143be096744d2fb488cccfb3a8bb2125b5c01c8c6a6ab474fe74b  /tmp/payload.tar.xz" | sha256sum -c -
          tar -tJf /tmp/payload.tar.xz >/dev/null
