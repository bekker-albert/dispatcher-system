name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_PUBLIC_DATA_PROVIDER: mysql
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Release check
        run: npm run release:check

      - name: Pack production build
        run: tar -czf "next-build-${GITHUB_SHA}.tar.gz" .next

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H dispetcher.kz >> ~/.ssh/known_hosts

      - name: Upload production build
        run: |
          scp -i ~/.ssh/id_ed25519 "next-build-${GITHUB_SHA}.tar.gz" root@dispetcher.kz:/root/

      - name: Deploy to production
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/id_ed25519 root@dispetcher.kz "DEPLOY_SHA='${DEPLOY_SHA}' bash -s" <<'EOF'
            set -euo pipefail
            export PATH="/usr/lib/ispnodejs/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
            export NODE_OPTIONS="--max-old-space-size=1024"
            export NEXT_TELEMETRY_DISABLED="1"
            APP_DIR="/var/www/www-root/data/apps/dispatcher-system"
            PM2_HOME="/var/www/www-root/data/.pm2"
            ARCHIVE="/root/next-build-${DEPLOY_SHA}.tar.gz"

            cd "$APP_DIR"
            node -e 'const [major] = process.versions.node.split(".").map(Number); if (major !== 24) throw new Error(`Node ${process.versions.node} does not match Node 24 production policy`);'

            git fetch --prune origin main
            git cat-file -e "${DEPLOY_SHA}^{commit}"
            git reset --hard "${DEPLOY_SHA}"
            test "$(git rev-parse HEAD)" = "${DEPLOY_SHA}"
            npm ci --omit=dev --no-audit --no-fund

            next_tmp=".next-${DEPLOY_SHA}"
            next_previous=".next-previous-${DEPLOY_SHA}"
            rm -rf "$next_tmp" "$next_previous"
            mkdir "$next_tmp"
            tar -xzf "$ARCHIVE" -C "$next_tmp" --strip-components=1 .next
            test -f "$next_tmp/BUILD_ID"

            rollback_next() {
              rm -rf .next
              if [ -d "$next_previous" ]; then
                mv "$next_previous" .next
                chown -R www-root:www-root .next
                sudo -u www-root env PATH="$PATH" PM2_HOME="$PM2_HOME" NODE_ENV=production pm2 reload dispetcher --update-env >/dev/null 2>&1 || true
              fi
            }
            trap rollback_next ERR INT TERM

            if [ -d .next ]; then
              mv .next "$next_previous"
            fi
            mv "$next_tmp" .next
            chown -R www-root:www-root .next

            sudo -u www-root env PATH="$PATH" PM2_HOME="$PM2_HOME" NODE_ENV=production pm2 reload dispetcher --update-env

            for i in $(seq 1 20); do
              curl -fsS http://127.0.0.1:3000/ >/dev/null && break
              sleep 1
            done
            curl -fsS http://127.0.0.1:3000/ >/dev/null

            trap - ERR INT TERM
            rm -rf "$next_previous" "$ARCHIVE"
          EOF

      - name: Production smoke
        env:
          PRODUCTION_SMOKE_URL: https://dispetcher.kz
          PRODUCTION_SMOKE_API_URL: https://dispetcher.kz
        run: npm run smoke:production
