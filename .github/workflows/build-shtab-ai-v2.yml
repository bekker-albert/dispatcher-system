name: Build Shtab AI V2
on:
  pull_request:
    branches:
      - main
jobs:
  build:
    if: startsWith(github.head_ref, 'temp/build-shtab-ai-v2-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: base64 -d shtab-ai-android/signing.keystore.b64 > shtab-ai-android/shtab-ai-release.jks
      - run: cd shtab-ai-android && gradle :app:assembleRelease
      - run: mkdir -p build-output && cp shtab-ai-android/app/build/outputs/apk/release/app-release.apk build-output/Shtab-AI-v2.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Shtab-AI-v2.0-apk
          path: build-output/
          retention-days: 2
