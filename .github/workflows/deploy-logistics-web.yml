name: Deploy logistics web

on:
  push:
    branches:
      - feature/gazel-logistics-release
    paths:
      - "app/api/logistics/**"
      - "app/logistics/**"
      - "features/logistics/**"
      - "lib/domain/logistics/**"
      - "lib/server/logistics/**"
      - "lib/server/mysql/logistics-*.ts"
      - "lib/server/mysql/schema.ts"
      - "scripts/ensure-logistics-schema.mjs"
      - "logistics-server.js"
      - ".github/workflows/deploy-logistics-web.yml"
  pull_request:
    branches:
      - main
    paths:
      - "app/api/logistics/**"
      - "app/logistics/**"
      - "features/logistics/**"
      - "lib/domain/logistics/**"
      - "lib/server/logistics/**"
      - "lib/server/mysql/logistics-*.ts"
      - "lib/server/mysql/schema.ts"
      - "scripts/ensure-logistics-schema.mjs"
      - "logistics-server.js"
      - ".github/workflows/deploy-logistics-web.yml"
  workflow_dispatch:

concurrency:
  group: logistics-web-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build web application
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: Pack release
        run: |
          set -euo pipefail
          items=(.next public package.json package-lock.json logistics-server.js scripts/ensure-logistics-schema.mjs)
          if [ -f next.config.ts ]; then items+=(next.config.ts); fi
          if [ -f next.config.mjs ]; then items+=(next.config.mjs); fi
          tar -czf logistics-web-${GITHUB_SHA}.tar.gz "${items[@]}"

      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${DEPLOY_PORT}" -H "${DEPLOY_HOST}" >> ~/.ssh/known_hosts

      - name: Upload release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          scp -i ~/.ssh/id_ed25519 -P "${DEPLOY_PORT}" "logistics-web-${GITHUB_SHA}.tar.gz" "${DEPLOY_USER}@${DEPLOY_HOST}:/var/www/dispatcher/data/www/logistics.aam-dispatch.kz/"

      - name: Install, migrate, verify and start
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -p "${DEPLOY_PORT}" "${DEPLOY_USER}@${DEPLOY_HOST}" "DEPLOY_SHA='${DEPLOY_SHA}' bash -s" <<'EOF'
            set -euo pipefail
            export PATH="/usr/lib/ispnodejs/bin:/usr/local/bin:/usr/bin:/bin"
            export PM2_HOME="/var/www/dispatcher/data/.pm2"
            export NEXT_TELEMETRY_DISABLED="1"

            site="/var/www/dispatcher/data/www/logistics.aam-dispatch.kz"
            main_site="/var/www/dispatcher/data/www/aam-dispatch.kz"
            archive="$site/logistics-web-${DEPLOY_SHA}.tar.gz"
            stage="$site/.release-${DEPLOY_SHA}"
            socket="/var/www/dispatcher/data/nodejs/0.sock"
            env_copy="/tmp/logistics-env-${DEPLOY_SHA}.local"
            backup="$site/data/previous-release.tar.gz"

            test -f "$archive"
            rm -rf "$stage"
            mkdir -p "$stage" "$site/data" "$site/logs"
            tar -xzf "$archive" -C "$stage"
            test -f "$stage/.next/BUILD_ID"
            test -f "$stage/logistics-server.js"
            test -f "$stage/scripts/ensure-logistics-schema.mjs"

            if [ -f "$site/.env.local" ]; then
              cp "$site/.env.local" "$env_copy"
            elif [ -f "$main_site/.env.local" ]; then
              cp "$main_site/.env.local" "$env_copy"
            else
              echo "No server environment file available for logistics"
              exit 1
            fi
            chmod 600 "$env_copy"

            main_before=$(node -e "const{execFileSync}=require('node:child_process');const rows=JSON.parse(execFileSync('/usr/lib/ispnodejs/bin/pm2',['jlist'],{encoding:'utf8',env:{...process.env,PM2_HOME:'/var/www/dispatcher/data/.pm2'}}));const row=rows.find(item=>item.name==='aam-dispatch');if(!row||row.pm2_env?.status!=='online')process.exit(1);process.stdout.write(String(row.pm2_env.restart_time)+':'+String(row.pm2_env.pm_uptime))")

            rm -f "$backup"
            if [ -f "$site/.next/BUILD_ID" ]; then
              tar --exclude='./data' --exclude='./logs' --exclude='./logistics-web-*.tar.gz' --exclude='./.release-*' -czf "$backup" -C "$site" .
            fi

            rollback() {
              echo "Deployment failed; restoring previous logistics release"
              /usr/lib/ispnodejs/bin/pm2 delete gazel-logistics-web >/dev/null 2>&1 || true
              rm -f "$socket"
              if [ -f "$backup" ]; then
                find "$site" -mindepth 1 -maxdepth 1 ! -name data ! -name logs ! -name '.env.local' -exec rm -rf {} +
                tar -xzf "$backup" -C "$site"
                cp "$env_copy" "$site/.env.local"
                chmod 600 "$site/.env.local"
                cd "$site"
                npm ci --omit=dev --no-audit --no-fund
                SOCKET_PATH="$socket" NODE_ENV=production /usr/lib/ispnodejs/bin/pm2 start logistics-server.js --name gazel-logistics-web --cwd "$site" --time --update-env || true
                /usr/lib/ispnodejs/bin/pm2 save || true
              fi
            }
            trap rollback ERR

            /usr/lib/ispnodejs/bin/pm2 delete gazel-logistics-web >/dev/null 2>&1 || true
            rm -f "$socket"
            find "$site" -mindepth 1 -maxdepth 1 ! -name data ! -name logs ! -name '.env.local' ! -name "$(basename "$archive")" ! -name "$(basename "$stage")" -exec rm -rf {} +
            cp -a "$stage"/. "$site"/
            rm -rf "$stage"
            cp "$env_copy" "$site/.env.local"
            chmod 600 "$site/.env.local"
            cd "$site"
            npm ci --omit=dev --no-audit --no-fund
            node scripts/ensure-logistics-schema.mjs

            SOCKET_PATH="$socket" NODE_ENV=production /usr/lib/ispnodejs/bin/pm2 start logistics-server.js --name gazel-logistics-web --cwd "$site" --time --update-env
            /usr/lib/ispnodejs/bin/pm2 save

            healthy=0
            for attempt in $(seq 1 60); do
              if curl -fsS --unix-socket "$socket" http://localhost/health/ >/tmp/logistics-health.json 2>/dev/null; then healthy=1; break; fi
              sleep 2
            done
            test "$healthy" = "1"
            grep -q 'gazel-logistics-web' /tmp/logistics-health.json
            curl -fsS --unix-socket "$socket" -H 'Host: logistics.aam-dispatch.kz' http://localhost/ | grep -q 'Логистика Газели'
            curl -fsS --unix-socket "$socket" -H 'Host: logistics.aam-dispatch.kz' http://localhost/logistics/release | grep -q 'Выпуск'
            curl -fsS --unix-socket "$socket" -H 'Host: logistics.aam-dispatch.kz' http://localhost/logistics/documents | grep -q 'Документ'

            api_status=$(curl -sS -o /tmp/logistics-api-anon.json -w '%{http_code}' --unix-socket "$socket" -H 'Host: logistics.aam-dispatch.kz' http://localhost/api/logistics)
            case "$api_status" in 401|403) ;; *) cat /tmp/logistics-api-anon.json; exit 1;; esac

            main_after=$(node -e "const{execFileSync}=require('node:child_process');const rows=JSON.parse(execFileSync('/usr/lib/ispnodejs/bin/pm2',['jlist'],{encoding:'utf8',env:{...process.env,PM2_HOME:'/var/www/dispatcher/data/.pm2'}}));const row=rows.find(item=>item.name==='aam-dispatch');if(!row||row.pm2_env?.status!=='online')process.exit(1);process.stdout.write(String(row.pm2_env.restart_time)+':'+String(row.pm2_env.pm_uptime))")
            test "$main_before" = "$main_after"

            trap - ERR
            rm -f "$archive" "$env_copy"
          EOF

      - name: Public smoke test
        run: |
          set -euo pipefail
          curl -fsS --retry 20 --retry-delay 3 --max-time 20 https://logistics.aam-dispatch.kz/health/ | grep -q 'gazel-logistics-web'
          curl -fsS --retry 20 --retry-delay 3 --max-time 20 https://logistics.aam-dispatch.kz/ | grep -q 'Логистика Газели'
          curl -fsS --retry 20 --retry-delay 3 --max-time 20 https://logistics.aam-dispatch.kz/logistics/release | grep -q 'Выпуск'
          curl -fsS --retry 20 --retry-delay 3 --max-time 20 https://logistics.aam-dispatch.kz/logistics/documents | grep -q 'Документ'
          curl -fsS --retry 20 --retry-delay 3 --max-time 20 https://aam-dispatch.kz/ >/tmp/aam-main.html
          test -s /tmp/aam-main.html
