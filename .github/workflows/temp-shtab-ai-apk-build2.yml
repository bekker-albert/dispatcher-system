name: Temporary build Shtab AI APK v2

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-apk:
    if: ${{ startsWith(github.head_ref, 'temp/build-shtab-ai-apk-') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout temporary branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Skip completed build
        id: existing
        shell: bash
        run: |
          if [ -f build-output/build-complete.txt ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java
        if: steps.existing.outputs.skip != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        if: steps.existing.outputs.skip != 'true'
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        if: steps.existing.outputs.skip != 'true'
        shell: bash
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        if: steps.existing.outputs.skip != 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify bundled interface
        if: steps.existing.outputs.skip != 'true'
        shell: bash
        run: |
          test -s shtab-ai-android/app/src/main/assets/index.html
          test -s shtab-ai-android/app/src/main/assets/styles.css
          test -s shtab-ai-android/app/src/main/assets/app.js
          node --check shtab-ai-android/app/src/main/assets/app.js
          mkdir -p build-output
          find shtab-ai-android -maxdepth 9 -type f -printf '%p %s bytes\n' | sort > build-output/generation-report.txt

      - name: Build installable APK
        if: steps.existing.outputs.skip != 'true'
        shell: bash
        run: cd shtab-ai-android && gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        if: steps.existing.outputs.skip != 'true'
        shell: bash
        run: |
          mkdir -p build-output
          cp shtab-ai-android/app/build/outputs/apk/debug/app-debug.apk build-output/Shtab-AI-v1.apk
          sha256sum build-output/Shtab-AI-v1.apk > build-output/sha256.txt

      - name: Upload APK artifact
        if: steps.existing.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Shtab-AI-v1-apk
          path: build-output/Shtab-AI-v1.apk
          if-no-files-found: error
          retention-days: 1

      - name: Encode APK for retrieval
        if: steps.existing.outputs.skip != 'true'
        shell: bash
        run: |
          base64 -w0 build-output/Shtab-AI-v1.apk | split -b 100000 -d -a 3 - build-output/apk.b64.part-
          ls -1 build-output/apk.b64.part-* > build-output/parts.txt
          printf "Штаб AI 1.0.0\nAPK собран GitHub Actions\n" > build-output/build-complete.txt
          rm build-output/Shtab-AI-v1.apk

      - name: Commit temporary output
        if: steps.existing.outputs.skip != 'true'
        shell: bash
        run: |
          git config user.name "shtab-ai-builder"
          git config user.email "actions@users.noreply.github.com"
          git add build-output
          git commit -m "chore: temporary APK output [skip ci]"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
