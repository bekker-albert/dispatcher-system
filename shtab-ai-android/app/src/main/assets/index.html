<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0c12">
  <title>Штаб AI — версия 1</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="phone-shell">
    <header class="topbar">
      <div>
        <h1 id="page-title">Добрый день, Альберт</h1>
        <p id="page-subtitle"></p>
      </div>
      <button class="icon-btn" id="notify-btn" aria-label="Уведомления">🔔</button>
    </header>

    <section id="today" class="page active"></section>
    <section id="plan" class="page"></section>
    <section id="assistant" class="page assistant-page"></section>
    <section id="projects" class="page"></section>
    <section id="more" class="page"></section>

    <button class="fab" id="fab" aria-label="Добавить задачу">＋</button>

    <nav class="bottom-nav">
      <button class="nav-item active" data-page="today"><span>◫</span><small>Сегодня</small></button>
      <button class="nav-item" data-page="plan"><span>▦</span><small>План</small></button>
      <button class="nav-item" data-page="assistant"><span>✦</span><small>Помощник</small></button>
      <button class="nav-item" data-page="projects"><span>▰</span><small>Проекты</small></button>
      <button class="nav-item" data-page="more"><span>•••</span><small>Еще</small></button>
    </nav>
  </main>

  <dialog id="task-dialog">
    <form method="dialog" id="task-form">
      <div class="dialog-head"><h2>Новая задача</h2><button value="cancel" class="close-btn">×</button></div>
      <label>Название<input id="task-title" required placeholder="Что нужно сделать?"></label>
      <div class="form-row">
        <label>Дата<input id="task-date" type="date" required></label>
        <label>Время<input id="task-time" type="time" required></label>
      </div>
      <label>Проект<select id="task-project"></select></label>
      <label>Приоритет<select id="task-priority"><option value="normal">Обычный</option><option value="high">Высокий</option><option value="low">Низкий</option></select></label>
      <div class="dialog-actions"><button value="cancel" class="secondary">Отмена</button><button type="submit" value="default" class="primary">Создать</button></div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
